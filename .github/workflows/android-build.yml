name: Android Build & Release

on:
  push:
    branches: [main]

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        id: eas-build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('eas-build.json', 'utf8').trim();
            const parsed = JSON.parse(raw);
            const builds = Array.isArray(parsed) ? parsed : [parsed];
            const build = builds.find(b => String(b.platform).toUpperCase() === 'ANDROID') || builds[0];
            if (!build?.id) throw new Error('No EAS build id found in output');
            const url = build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl || build.artifactUrl;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_id=' + build.id + '\n');
            if (url) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'artifact_url=' + url + '\n');
          "

      - name: Download APK
        run: |
          if [ -n "${{ steps.eas-build.outputs.artifact_url }}" ]; then
            curl --fail --location "${{ steps.eas-build.outputs.artifact_url }}" --output app-release.apk
          else
            eas build:download --build-id "${{ steps.eas-build.outputs.build_id }}" --non-interactive
            mv *.apk app-release.apk
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/app-release.apk
          tag_name: v${{ github.run_number }}
          name: Android Build v${{ github.run_number }}
          body: |
            Automated Android APK build from commit ${{ github.sha }}
          fail_on_unmatched_files: true
